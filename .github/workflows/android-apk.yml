name: Android APK

# Builds release APKs for every push to main, signed with the repository keystore,
# and attaches them to the workflow run. Pull requests are built by
# android-apk-pr.yml, which has no access to the keystore. A version tag (v2.22.0
# or 2.22.0) additionally publishes them as a GitHub release: either pushed by hand,
# or created by release.yml, which calls this workflow with the tag it just made.
# Nothing goes to any store.

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing tag to build and publish as a GitHub release
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true

concurrency:
  group: android-apk-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # Set for release builds only: the tag handed over by release.yml, or the pushed tag.
  # When called from release.yml the github context is the caller's (main), so every
  # step below reads this instead of github.ref.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  # Keep in sync with android-apk-pr.yml, ci.yml and build.yml.
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false

      - name: Build APKs
        uses: ./.github/actions/build-android-apk
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          release-tag: ${{ env.RELEASE_TAG }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

  release:
    name: Publish GitHub release
    needs: build
    if: inputs.release_tag || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plezy-android-apk-${{ github.sha }}
          path: apk

      - name: Rename APKs
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "apk/app-$abi-release.apk" "plezy-android-$abi.apk"
          done

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: plezy-android-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
